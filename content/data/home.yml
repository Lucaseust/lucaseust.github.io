bio:
  paragraphs:
    - "I am a PhD student in management and information systems at University Paris-Dauphine - PSL. I study how organizations share data, and how the circulation of data is governed."
    - "My dissertation, supervised by Eric Brousseau, focuses on data-sharing intermediaries, data spaces, and the commodification of data. I also have research interests in personal data regulation, political economy and local government, and emergency and disaster management."
    - "I combine fieldwork and quantitative methods, including interviews, case studies, econometrics, and text analysis."
