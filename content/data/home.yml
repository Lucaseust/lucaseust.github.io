bio:
  paragraphs:
  - Je suis docteur en sciences de gestion et systèmes d’information de l’Université Paris Dauphine – PSL. Mes recherches portent sur la gouvernance organisationnelle
    et institutionnelle du partage de données entre organisations.
  - Ma thèse, dirigée par Éric Brousseau, étudie comment les marchés de données, les écosystèmes de partage et les infrastructures publiques de données
    permettent un partage durable. Je m’intéresse également aux traces numériques et à la gestion des urgences et des catastrophes.
  - 'Je combine enquêtes de terrain et méthodes quantitatives : entretiens, études de cas, économétrie et analyse de textes.'
  paragraphs_en:
  - I hold a PhD in management and information systems from Paris Dauphine University – PSL. I study the organizational and institutional governance of data sharing between organizations.
  - My dissertation, supervised by Éric Brousseau, examined how data markets, data-sharing ecosystems, and public data infrastructures enable sustainable data sharing. I also study digital trace data and emergency and disaster management.
  - 'I combine fieldwork and quantitative methods: interviews, case studies, econometrics, and text analysis.'
