bio:
  paragraphs:
    - "I am a PhD student in management and information systems at University Paris-Dauphine - PSL. I study the economics and governance models of interorganisational data sharing."
    - "My dissertation, supervised by Eric Brousseau, focuses on data-sharing intermediaries and the commodification of data. I also have research interests in personal data regulation, political economy and local government, and emergency and disaster management."
    - "I combine fieldwork and quantitative methods, including interviews, case studies, econometrics, and text analysis."

research:
  title: "Data sharing, governance, and regulation"
  text: "My dissertation examines the business models of data-sharing intermediaries and the economics of data-sharing ecosystems. I also work on data governance, digital regulation, and the institutional arrangements that shape exchanges of data between organizations."
  focus:
    - title: "Data Governance and Intermediation"
      text: "Data-sharing intermediaries, data spaces, governance design, and value creation."
    - title: "Digital Regulation"
      text: "Personal data regulation, institutional design, and comparative regulatory models."
    - title: "Platforms and Digital Economy"
      text: "Markets for data, digital platforms, and sectoral data infrastructures."

selected_publication:
  title: "The Economics of Data-Sharing"
  text: "**The Economics of Data-Sharing: An Empirical Investigation of Data Sharing Ecosystems**, with Eric Brousseau and Joelle Toledano, appears in the *ICIS 2025 Proceedings*. The paper studies economic and governance conditions associated with the development of data-sharing ecosystems."
  link_label: "View the ICIS record"
  link_url: "https://aisel.aisnet.org/icis2025/sharing_econ/sharing_econ/6"

working_papers:
  title: "Working papers"
  items:
    - title: "Interpretable Digital Traces: Mobile Wikipedia Usage and City-Level Tourism"
      byline: "with Paul Favier"
      text: "Links daily hotel room-nights to mobile and desktop Wikipedia pageviews for 704 French communes from 2018 to 2025 to build interpretable, high-frequency indicators of local tourism activity."
    - title: "Intrinsic Data Liquidity and the Emergence of Market Governance for Data Sharing"
      byline: "Single-authored"
      text: "Introduces intrinsic data liquidity to explain why some data products can be exchanged through scalable markets while others require bespoke governance."
    - title: "Models of Personal Data Regulation"
      byline: "with Rami Benabdelkrim and Surjasama Lahiri"
      text: "Studies how countries converge toward European, Chinese, or American models of personal data regulation using a comparative dataset of legal provisions across jurisdictions."
    - title: "Emergence of Data Sharing Ecosystems in Disaster Management"
      byline: "with Anouk Adrot and Salome Ritouret"
      text: "Investigates how formal norms and bottom-up practices interact in disaster risk reduction ecosystems through interviews, NLP-assisted mapping, observation, and archival material."
