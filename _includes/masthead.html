{% include base_path %}
<header class="masthead" role="banner">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-nav__brand{% if page.url == '/' or page.url == '/index.html' %} selected{% endif %}" href="{{ base_path }}/">{{ site.title }}</a>
        <div class="site-nav__links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <a class="{% if page.url contains link.url and link.url != '/' %}selected{% endif %}" href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
          {% endfor %}
        </div>
      </nav>
    </div>
  </div>
</header>
