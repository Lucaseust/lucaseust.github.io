<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.title }}</a>
  <nav aria-label="Main navigation">
    {% for link in site.data.navigation.main %}
      {% assign active = false %}
      {% if page.url == link.url %}{% assign active = true %}{% endif %}
      {% if link.url != '/' and page.url contains link.url %}{% assign active = true %}{% endif %}
      <a href="{{ link.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
  </nav>
</header>
