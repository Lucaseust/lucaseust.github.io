bio:
  paragraphs:
    - "I am a PhD student in management and information systems at University Paris-Dauphine - PSL, where I study the governance and economics of data sharing. My work starts from a practical question: when organizations say they want to share data, what has to be built around the data for trust, incentives, and value to last?"
    - "My dissertation, supervised by Eric Brousseau, focuses on data-sharing intermediaries, data spaces, and sectoral digital infrastructures. I am especially interested in the point where strategy, regulation, and information systems meet: the governance choices that turn a data-sharing initiative into something people can actually use."
    - "I combine fieldwork and quantitative methods, including interviews, case studies, econometrics, and text analysis. Alongside my research, I teach at University Paris-Dauphine - PSL as an ATER."
